# Ao criar uma tag v*, compila o app num Mac do GitHub e publica UsageBar.zip em Releases.
# Uso: git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Testes
        run: swift test

      - name: Empacotar
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh --package-only
          ditto -c -k --keepParent .build/app/UsageBar.app UsageBar.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" UsageBar.zip \
            --title "UsageBar $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Baixe o UsageBar.zip, descompacte e mova o UsageBar.app para ~/Applications. O app não é assinado com Developer ID: antes de abrir pela primeira vez, rode \`xattr -dr com.apple.quarantine ~/Applications/UsageBar.app\` (detalhes na seção Gatekeeper do README)."
