# Ao criar uma tag v*, compila o app num Mac do GitHub e publica UsageBar.zip em Releases.
# Uso: git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  release:
    needs: security
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Testes
        run: swift test

      - name: Empacotar
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh --package-only
          ditto -c -k --keepParent .build/app/UsageBar.app UsageBar.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" UsageBar.zip \
              --title "UsageBar $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" UsageBar.zip \
              --title "UsageBar $GITHUB_REF_NAME" --generate-notes \
              --notes "Baixe o UsageBar.zip, descompacte e mova o UsageBar.app para ~/Applications. O app usa assinatura ad-hoc; consulte o README para informações sobre o Gatekeeper."
          fi
